<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth">
<main class="card">
    <h1>🌾 Farmer Portal</h1>
    <p class="error" th:if="${param.error}">Invalid email or password</p>
    <p class="ok" th:if="${param.registered}">Registration successful. Please login.</p>
    <p class="ok" th:if="${param.logout}">You have been logged out.</p>
    <form th:action="@{/login}" method="post">
        <label>Email
            <input name="username" type="email" placeholder="you@example.com" required autocomplete="username"></label>
        <label>Password
            <input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Login</button>
    </form>
    <p class="alt">New farmer? <a th:href="@{/register}">Register here</a></p>
</main>
</body>
</html>
