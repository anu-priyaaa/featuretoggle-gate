<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth">
<main class="card">
    <h1>🌾 Farmer Registration</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" method="post">
        <label>Full name
            <input name="fullName" th:value="${fullName}" required autocomplete="name"></label>
        <label>Village
            <input name="village" th:value="${village}" required></label>
        <label>Email
            <input name="email" type="email" th:value="${email}" required autocomplete="email"></label>
        <label>Password (min 6 characters)
            <input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
        <label>Confirm password
            <input name="confirmPassword" type="password" minlength="6" required autocomplete="new-password"></label>
        <button type="submit">Create account</button>
    </form>
    <p class="alt">Already registered? <a th:href="@{/login}">Login</a></p>
</main>
</body>
</html>
