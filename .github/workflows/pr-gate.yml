name: PR quality and security gate

# Runs on every pull request into main. Mark the four jobs below as
# "required status checks" in branch protection so a red check blocks the merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: 1 - Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      # Compiles main + test code. Compiler warnings are errors (see pom.xml).
      - run: ./mvnw -B -ntp clean test-compile

  lint:
    name: 2 - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      # Rules live in config/checkstyle.xml. Any violation fails the job.
      - run: ./mvnw -B -ntp checkstyle:check

  unit-tests:
    name: 3 - Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      # verify = run tests, then JaCoCo fails the build below coverage.minimum (pom.xml).
      - run: ./mvnw -B -ntp clean verify
      - name: Add coverage to the job summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1{m+=$8;c+=$9} END{printf "### Line coverage: %.1f%% (%d of %d lines)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  dependency-scan:
    name: 4 - Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails on any HIGH or CRITICAL vulnerability that has a fix available.
      # Runs the official Trivy image directly (no third-party action to break).
      - name: Trivy scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/aquasecurity/trivy:0.58.1 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table .
